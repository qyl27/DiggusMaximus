[versions]
architectury-plugin = "3.5-SNAPSHOT"
architectury-loom = "1.17-SNAPSHOT"
shadow = "9.3.0+"
mod-publish = "2.2.0"

minecraft = "26.1.2"
neoforge = "26.1.2.50-beta"
fabric-loader = "0.19.2"
fabric-api = "0.148.2+26.1.2"
mod-menu = "18.0.0-beta.1"
cloth-config = "26.1.154"
jetbrains-annotations = "26.1.0"
lombok = "1.18.42"
junit = "6.1.2"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
neoforge = { module = "net.neoforged:neoforge", version.ref = "neoforge" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

cloth-config-common = { module = "me.shedaniel.cloth:cloth-config", version.ref = "cloth-config" }
cloth-config-fabric = { module = "me.shedaniel.cloth:cloth-config-fabric", version.ref = "cloth-config" }
cloth-config-neoforge = { module = "me.shedaniel.cloth:cloth-config-neoforge", version.ref = "cloth-config" }
mod-menu = { module = "com.terraformersmc:modmenu", version.ref = "mod-menu" }

jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
architectury-plugin = { id = "architectury-plugin", version.ref = "architectury-plugin" }
architectury-loom = { id = "dev.architectury.loom-no-remap", version.ref = "architectury-loom" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
mod-publish = { id = "me.modmuss50.mod-publish-plugin", version.ref = "mod-publish" }
