modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
issueTrackerURL = "https://github.com/qyl27/DiggusMaximus/issues"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Diggus Maximus Reborn"
authors = "qyl27"
credits = "kyrptonaught"
description = '''
Mine ores more better!
'''
logoFile = "assets/diggusmaximus/icon.png"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${neoforge_minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "required"
versionRange = "${neoforge_cloth_config_version_range}"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "diggusmaximus.mixins.json"

[[mixins]]
config = "diggusmaximus-neoforge.mixins.json"
