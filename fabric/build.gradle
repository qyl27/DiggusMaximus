architectury {
    platformSetupLoomIde()
    fabric()
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    modApi "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    modCompileOnly "com.terraformersmc:modmenu:${rootProject.fabric_mod_menu_version}"
    modRuntimeOnly "com.terraformersmc:modmenu:${rootProject.fabric_mod_menu_version}"

    common(project(path: ':', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':', configuration: 'transformProductionFabric')
}

remapJar {
    injectAccessWidener = true
}
unifiedPublishing {
    project {
        displayName = "(Fabric) ${rootProject.mod_version} for MC ${rootProject.minecraft_version}"
        version = rootProject.version
        gameVersions = [rootProject.minecraft_version]
        gameLoaders = ['fabric']
        releaseType = 'release'

        mainPublication tasks.remapJar

        relations {
            depends {
                curseforge = 'fabric-api'
                modrinth = 'fabric-api'
            }

            depends {
                curseforge = 'cloth-config'
                modrinth = 'cloth-config'
            }
        }

        curseforge {
            token = Objects.requireNonNullElse(System.getenv('MOD_CURSEFORGE_TOKEN'), "")
            id = rootProject.curseforge_project_id
        }

        modrinth {
            token = Objects.requireNonNullElse(System.getenv('MOD_MODRINTH_TOKEN'), "")
            id = rootProject.modrinth_project_id
        }
    }
}
